<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="LifeOS — your personal operating system for tasks, habits, calendar, notes, finance and more." />
    <title>LifeOS — Personal Operating System</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lifeos-theme');
          var dark = stored ? stored === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
